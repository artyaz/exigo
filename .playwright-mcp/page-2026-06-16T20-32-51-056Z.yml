            - generic [ref=e78]: "<exercise accent=\"azure\"> <prompt> A `monotonic_buffer_resource` bumps a pointer and **never frees**. Keep every allocation inside the **128 B buffer** so nothing spills to the heap. </prompt> <state obs=\"[]\" blocks=\"[]\" bufUsed=\"0\" heapCount=\"0\" runId=\"0\"/> <on event=\"ran\"> <set key=\"obs\" to=\"event.observations\"/> <set key=\"blocks\" to=\"[]\"/> <set key=\"bufUsed\" to=\"0\"/> <set key=\"heapCount\" to=\"0\"/> <set key=\"runId\" to=\"runId + 1\"/> </on> <on event=\"obs:alloc\" when='event.region == \"buf\"' seq> <set key=\"blocks\" to='push(blocks, record(\"id\", event.id, \"size\", event.size, \"region\", event.region, \"label\", event.label))'/> <set key=\"bufUsed\" to=\"bufUsed + event.size\"/> </on> <on event=\"obs:alloc\" when='event.region == \"heap\"' seq> <set key=\"blocks\" to='push(blocks, record(\"id\", event.id, \"size\", event.size, \"region\", event.region, \"label\", event.label))'/> <set key=\"heapCount\" to=\"heapCount + 1\"/> </on> <on event=\"play:reset\" seq> <set key=\"blocks\" to=\"[]\"/> <set key=\"bufUsed\" to=\"0\"/> <set key=\"heapCount\" to=\"0\"/> </on> <code harness=\"js-observation\" edit=\"free\" event=\"ran\"> <locked id=\"alloc\"> // monotonic_buffer_resource: bump a pointer, NEVER free. const CAP = 128; let used = 0; function reserve(name, bytes) { if (used + bytes <= CAP) { used += bytes; alloc(name, bytes, \"buf\", name); } else { alloc(name, bytes, \"heap\", name); } } </locked> <edit id=\"body\" maxChars=\"1200\"> // A vector that doubles (8→16→32→64→128) burns 248 B of dead blocks // the monotonic buffer can never reclaim. Reserve the final size once. reserve(\"vec_8\", 8); reserve(\"vec_16\", 16); reserve(\"vec_32\", 32); reserve(\"vec_64\", 64); </edit> </code> <arena label=\"std::pmr::monotonic_buffer_resource\"> <region id=\"buf\" capacity=\"128\" unit=\"B\" tone=\"azure\">buffer</region> <region id=\"heap\" unit=\"B\" tone=\"no\">system heap</region> <blocks bind=\"blocks\"/> <overflow from=\"buf\" to=\"heap\" label=\"overflow\"/> </arena> <readout label=\"buffer used\" value='concat(bufUsed, \" / 128 B\")'/> <player source=\"obs\" version=\"runId\" label=\"allocations\" fps=\"2\"/> <goal when=\"heapCount == 0 and bufUsed >= 128\" proximity=\"1 - heapCount / 4\"> <ok>No spill — the live data sits entirely in the buffer. Reserve once, churn never.</ok> <no>Something escaped to the heap. Doubling reallocations leave dead blocks the monotonic buffer can't reclaim — reserve the final size up front.</no> </goal> </exercise>"
