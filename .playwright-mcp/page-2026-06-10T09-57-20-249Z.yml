        - textbox "spec editor" [ref=e21]: "{ \"type\": \"reactive\", \"accent\": \"violet\", \"prompt\": \"Each run charges `cost(n)` operations for inputs **n = 1…8**, plotting one point per n. The dashed line is your **time budget (48 ops)**. **Keep every point on or under the budget** — pick a complexity that scales.\", \"hook\": \"Declare a data model (`[n, cost]` points); the **plot** auto-fits the axes, picks tick steps, and draws your curve, the budget ghost, and the worst-case cursor. You never place a pixel.\", \"state\": { \"obs\": [], \"samples\": [], \"peak\": 0, \"budget\": [ [ 1, 48 ], [ 8, 48 ] ], \"runId\": 0 }, \"reactions\": [ { \"on\": \"ran\", \"do\": [ { \"set\": \"obs\", \"to\": \"event.observations\" }, { \"set\": \"samples\", \"to\": \"[]\" }, { \"set\": \"peak\", \"to\": \"0\" }, { \"set\": \"runId\", \"to\": \"runId + 1\" } ] }, { \"on\": \"obs:point\", \"allowSequentialWrite\": true, \"do\": [ { \"set\": \"samples\", \"to\": \"push(samples, record(\\\"x\\\", event.x, \\\"y\\\", event.y))\" }, { \"set\": \"peak\", \"to\": \"max(peak, event.y)\" } ] }, { \"on\": \"play:reset\", \"allowSequentialWrite\": true, \"do\": [ { \"set\": \"samples\", \"to\": \"[]\" }, { \"set\": \"peak\", \"to\": \"0\" } ] } ], \"evaluator\": { \"ok\": \"len(samples) >= 8 && peak <= 48\", \"msgOk\": \"Every point sits under the budget — this complexity scales.\", \"msgNo\": \"Some n blows the budget. A quadratic cost (n*n) explodes as n grows; choose a cost that grows linearly or slower.\", \"proximity\": \"1 - clamp((peak - 48) / 64, 0, 1)\" }, \"evaluatePolicy\": { \"onEvent\": true, \"onSubmit\": false }, \"display\": [ { \"type\": \"codeProbe\", \"language\": \"javascript\", \"harness\": { \"id\": \"js-observation\" }, \"editMode\": \"multiRegionFreeText\", \"runMode\": \"manualRun\", \"event\": \"ran\", \"source\": [ { \"kind\": \"locked\", \"id\": \"head\", \"text\": \"// We charge cost(n) operations for n = 1..8 and plot each point.\\n// The dashed budget line sits at 48 ops — stay on or under it.\\n\" }, { \"kind\": \"editableText\", \"id\": \"cost\", \"maxChars\": 400, \"initial\": \"function cost(n) {\\n // How many ops does your algorithm do for input n?\\n return n * n; // quadratic — try a cheaper growth\\n}\\n\" }, { \"kind\": \"locked\", \"id\": \"runner\", \"text\": \"\\nfor (let n = 1; n <= 8; n++) {\\n emit(\\\"point\\\", { x: n, y: cost(n) });\\n}\\n\" } ] }, { \"type\": \"plot\", \"label\": \"cost(n) vs budget\", \"x\": { \"label\": \"input n\", \"min\": 0, \"max\": 8 }, \"y\": { \"label\": \"operations\", \"min\": 0 }, \"series\": [ { \"id\": \"cost\", \"points\": \"samples\", \"style\": \"area\", \"tone\": \"violet\", \"label\": \"your cost\" } ], \"target\": { \"id\": \"budget\", \"points\": \"budget\", \"style\": \"line\", \"tone\": \"no\", \"label\": \"budget\" }, \"cursor\": { \"x\": \"8\", \"y\": \"peak\", \"label\": \"peak\", \"tone\": \"no\" } }, { \"type\": \"stateBadge\", \"label\": \"peak cost\", \"value\": \"concat(peak, \\\" ops\\\")\" }, { \"type\": \"observationPlayer\", \"source\": \"obs\", \"version\": \"runId\", \"label\": \"samples\", \"playback\": { \"mode\": \"auto\", \"fps\": 4 } } ] }"
