        - textbox "spec editor" [ref=e22]: "{ \"type\": \"reactive\", \"accent\": \"azure\", \"prompt\": \"This JS models a `std::pmr::monotonic_buffer_resource` of **128 B** — it bumps a pointer and **never frees**. The doubling vector spills to the heap. **Hold all 128 B in the buffer with no heap spill.**\", \"hook\": \"Same primitive, any domain: declare regions + sized blocks; the **arena** packs them, draws the capacity gauge, and routes the overflow arrow. You never write a coordinate.\", \"state\": { \"obs\": [], \"blocks\": [], \"bufUsed\": 0, \"heapCount\": 0, \"runId\": 0 }, \"reactions\": [ { \"on\": \"ran\", \"do\": [ { \"set\": \"obs\", \"to\": \"event.observations\" }, { \"set\": \"blocks\", \"to\": \"[]\" }, { \"set\": \"bufUsed\", \"to\": \"0\" }, { \"set\": \"heapCount\", \"to\": \"0\" }, { \"set\": \"runId\", \"to\": \"runId + 1\" } ] }, { \"on\": \"obs:alloc\", \"when\": \"event.region == \\\"buf\\\"\", \"allowSequentialWrite\": true, \"do\": [ { \"set\": \"blocks\", \"to\": \"push(blocks, record(\\\"id\\\", event.id, \\\"size\\\", event.size, \\\"region\\\", event.region, \\\"label\\\", event.label))\" }, { \"set\": \"bufUsed\", \"to\": \"bufUsed + event.size\" } ] }, { \"on\": \"obs:alloc\", \"when\": \"event.region == \\\"heap\\\"\", \"allowSequentialWrite\": true, \"do\": [ { \"set\": \"blocks\", \"to\": \"push(blocks, record(\\\"id\\\", event.id, \\\"size\\\", event.size, \\\"region\\\", event.region, \\\"label\\\", event.label))\" }, { \"set\": \"heapCount\", \"to\": \"heapCount + 1\" } ] }, { \"on\": \"play:reset\", \"allowSequentialWrite\": true, \"do\": [ { \"set\": \"blocks\", \"to\": \"[]\" }, { \"set\": \"bufUsed\", \"to\": \"0\" }, { \"set\": \"heapCount\", \"to\": \"0\" } ] } ], \"evaluator\": { \"ok\": \"heapCount == 0 && bufUsed >= 128\", \"msgOk\": \"No spill — the live data sits entirely in the buffer. Reserve once, churn never.\", \"msgNo\": \"Something escaped to the heap. Doubling reallocations leave dead blocks the monotonic buffer can't reclaim — reserve the final size up front.\", \"proximity\": \"1 - heapCount / 4\" }, \"evaluatePolicy\": { \"onEvent\": true, \"onSubmit\": false }, \"criticalThinking\": \"A monotonic buffer never reclaims, yet it's often *faster* than a general allocator. When is 'waste memory, never free' the right trade — and when would it bite you?\", \"code\": { \"type\": \"codeProbe\", \"language\": \"javascript\", \"harness\": { \"id\": \"js-observation\" }, \"editMode\": \"multiRegionFreeText\", \"runMode\": \"manualRun\", \"event\": \"ran\", \"source\": [ { \"kind\": \"locked\", \"id\": \"alloc\", \"text\": \"// monotonic_buffer_resource: bump a pointer, NEVER free.\\nconst CAP = 128;\\nlet used = 0;\\nfunction reserve(name, bytes) {\\n if (used + bytes <= CAP) {\\n used += bytes;\\n alloc(name, bytes, \\\"buf\\\", name);\\n } else {\\n alloc(name, bytes, \\\"heap\\\", name);\\n }\\n}\\n\" }, { \"kind\": \"editableText\", \"id\": \"body\", \"maxChars\": 1200, \"initial\": \"// std::pmr::vector<int> growing by doubling.\\n// Every growth reallocates; the old block is never reclaimed.\\nreserve(\\\"cap=2\\\", 8);\\nreserve(\\\"cap=4\\\", 16);\\nreserve(\\\"cap=8\\\", 32);\\nreserve(\\\"cap=16\\\", 64);\\nreserve(\\\"cap=32\\\", 128);\\n\" } ] }, \"stage\": { \"type\": \"arena\", \"label\": \"std::pmr::monotonic_buffer_resource\", \"regions\": [ { \"id\": \"buf\", \"label\": \"buffer\", \"capacity\": 128, \"unit\": \"B\", \"tone\": \"azure\" }, { \"id\": \"heap\", \"label\": \"system heap\", \"unit\": \"B\", \"tone\": \"no\" } ], \"blocks\": \"blocks\", \"overflow\": { \"from\": \"buf\", \"to\": \"heap\", \"label\": \"overflow\" } }, \"readouts\": [ { \"type\": \"stateBadge\", \"label\": \"buffer used\", \"value\": \"concat(bufUsed, \\\" / 128 B\\\")\" } ], \"player\": { \"type\": \"observationPlayer\", \"source\": \"obs\", \"version\": \"runId\", \"label\": \"allocations\", \"playback\": { \"mode\": \"auto\", \"fps\": 2 } } }"
