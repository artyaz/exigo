 buffer can't reclaim — reserve the final size up front.\", \"proximity\": \"1 - heapCount / 4\" }, \"evaluatePolicy\": { \"onEvent\": true, \"onSubmit\": false }, \"display\": [ { \"type\": \"codeProbe\", \"language\": \"javascript\", \"harness\": { \"id\": \"js-observation\" }, \"editMode\": \"multiRegionFreeText\", \"runMode\": \"manualRun\", \"event\": \"ran\", \"source\": [ { \"kind\": \"locked\", \"id\": \"alloc\", \"text\": \"// monotonic_buffer_resource: bump a pointer, NEVER free.\\nconst CAP = 128;\\nlet used = 0;\\nfunction reserve(name, bytes) {\\n if (used + bytes <= CAP) {\\n used += bytes;\\n alloc(name, bytes, \\\"buf\\\", name);\\n } else {\\n alloc(name, bytes, \\\"heap\\\", name);\\n }\\n}\\n\" }, { \"kind\": \"editableText\", \"id\": \"body\", \"maxChars\": 1200, \"initial\": \"// std::pmr::vector<int> growing by doubling.\\n// Every growth reallocates; the old block is never reclaimed.\\nreserve(\\\"cap=2\\\", 8);\\nreserve(\\\"cap=4\\\", 16);\\nreserve(\\\"cap=8\\\", 32);\\nreserve(\\\"cap=16\\\", 64);\\nreserve(\\\"cap=32\\\", 128);\\n\" } ] }, { \"type\": \"arena\", \"label\": \"std::pmr::monotonic_buffer_resource\", \"regions\": [ { \"id\": \"buf\", \"label\": \"buffer\", \"capacity\": 128, \"unit\": \"B\", \"tone\": \"azure\" }, { \"id\": \"heap\", \"label\": \"system heap\", \"unit\": \"B\", \"tone\": \"no\" } ], \"blocks\": \"blocks\", \"overflow\": { \"from\": \"buf\", \"to\": \"heap\", \"label\": \"overflow → operator new\" } }, { \"type\": \"stateBadge\", \"label\": \"buffer used\", \"value\": \"concat(bufUsed, \\\" / 128 B\\\")\" }, { \"type\": \"observationPlayer\", \"source\": \"obs\", \"version\": \"runId\", \"label\": \"allocations\", \"playback\": { \"mode\": \"auto\", \"fps\": 2 } } ] }"
