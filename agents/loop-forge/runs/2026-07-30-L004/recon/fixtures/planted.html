<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Planted defects</title>
<style>
 body{font-family:system-ui;background:#ffffff;color:#111;margin:0;padding:24px}
 .lowcontrast{color:#b9b9b9;background:#ffffff}      /* ~1.9:1 — WCAG AA fail */
 .tiny{width:14px;height:14px;padding:0;font-size:8px} /* <24px hit target */
 .ghost{color:#f2f2f2;background:#ffffff}            /* ~1.1:1 — severe fail */
 .ok{color:#1a1a1a;background:#ffffff}               /* ~16:1 — pass */
</style></head><body>
<h1>Dashboard</h1>
<h4 id="skipped">Recent activity</h4>            <!-- heading order h1 -> h4 -->
<p class="lowcontrast">Filter results by date range</p>
<p class="ghost">Your trial ends in 3 days</p>
<img src="chart.png">                              <!-- missing alt -->
<input type="text" placeholder="Search">           <!-- no label -->
<button class="tiny">x</button>                    <!-- tiny hit target -->
<div onclick="alert(1)">Open settings</div>        <!-- div as button, not focusable -->
<a href="#">click here</a>                         <!-- non-descriptive link -->
<p class="ok">This paragraph is readable.</p>
</body></html>
