name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build, Test, and SonarQube Analyze
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Disabling shallow clone is strictly recommended for better relevance of SonarQube analysis
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Type Check
        # Runs `next lint` and `tsc --noEmit` defined in package.json
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm run check

      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=artyaz
            -Dsonar.projectKey=artyaz_exigo
            -Dsonar.sources=.
